[project]
name = "book-translator"
version = "0.1.0"
description = "Offline Large Document (Book) Translation System using NLLB and Aya LLM"
authors = [
    {name = "User", email = "user@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "ctranslate2>=4.0.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "scipy>=1.12.0",
    "llama-cpp-python>=0.2.70; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "ebooklib>=0.18",
    "python-docx>=1.1.0",
    "spacy>=3.7.0",
    "beautifulsoup4>=4.12.0",
    "loguru>=0.7.2",
    "pydantic-settings>=2.2.1",
    "dependency-injector>=4.41.0",
    "PyMuPDF>=1.23.0",
    "fpdf2>=2.7.0",
    "customtkinter>=5.2.2",
    "python-dotenv>=1.0.1"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
